name: AI Issue Fixer (all files)

on:
  issues:
    types: [labeled]

jobs:
  ai-fix-all-files:
    if: contains(github.event.issue.labels.*.name, 'ai-fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract issue info
        id: issue
        run: |
          echo "TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          echo "BODY=${{ github.event.issue.body }}" >> $GITHUB_ENV

      - name: Find candidate files (js example)
        id: filelist
        run: |
          find . -type f -name "*.js" -printf "%p\n" > filelist.txt

      - name: Read candidate files into input
        id: read_all
        run: |
          echo 'CODEBASE<<EOF' >> $GITHUB_OUTPUT
          while read FILE; do
            echo "----- $FILE -----" >> $GITHUB_OUTPUT
            cat "$FILE" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
          done < filelist.txt
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: AI Fix via Copilot Models
        id: copilot
        uses: github/copilot-models@v1
        with:
          model: gpt-4o
          prompt: |
            You are an expert developer. Based on the following issue, find and fix relevant code in the provided files.
            Issue title: ${{ env.TITLE }}
            Issue description: ${{ env.BODY }}
            Codebase:
            ${{ steps.read_all.outputs.CODEBASE }}
            Respond with the fixed file(s) and changes ONLY as valid JSON:
            {
              "files": [
                {"name": "filename.js", "content": "fixed file content"}
              ]
            }

      - name: Apply fix from AI output
        id: apply_fix
        run: |
          echo "${{ steps.copilot.outputs.result }}" > ai-fix.json
          python3 <<'EOF'
            import json
            with open("ai-fix.json") as f:
                result = json.load(f)
            for file in result["files"]:
                # Crea/aggiorna ogni file
                with open(file["name"], "w") as out:
                    out.write(file["content"])
            EOF

      - name: Create branch for PR
        run: |
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "AI fix for issue #${{ github.event.issue.number }}: ${{ env.TITLE }}"
          git push origin $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH_NAME || '${{ env.BRANCH_NAME }}';
            const title = `AI Fix: #${{ github.event.issue.number }} - ${{ env.TITLE }}`;
            const body = `This PR was automatically generated by AI to fix issue #${{ github.event.issue.number }}.\n\nIssue:\n${{ env.BODY }}`;
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'main',
              title,
              body
            });