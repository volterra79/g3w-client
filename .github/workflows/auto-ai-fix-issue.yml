name: Auto AI Fix All Files

on:
  issues:
    types:
      - opened

jobs:
  process_ai_fix:
    runs-on: ubuntu-latest
    steps:

      - name: Check issue contains 'ai-fix' label
        id: check_label
        run: |
          echo "process=false" >> $GITHUB_OUTPUT
          for label in $(jq -r '.issue.labels[].name' < "${GITHUB_EVENT_PATH}"); do
            if [[ "$label" == "ai-fix" ]]; then
              echo "process=true" >> $GITHUB_OUTPUT
              break
            fi
          done

      - name: Checkout repository
        if: steps.check_label.outputs.process == 'true'
        uses: actions/checkout@v3

      - name: Find all JavaScript files
        if: steps.check_label.outputs.process == 'true'
        id: find_files
        run: |
          FILE_LIST=$(find . -type f -name "*.js" | grep -v node_modules)
          echo "$FILE_LIST" > files_ai_fix.txt

      - name: Apply AI fix to all files
        if: steps.check_label.outputs.process == 'true'
        id: ai_fixes
        # Aggiungi questo per autorizzare la CLI
        run: |
          ISSUE_TITLE=$(jq -r '.issue.title' < "${GITHUB_EVENT_PATH}")
          ISSUE_BODY=$(jq -r '.issue.body' < "${GITHUB_EVENT_PATH}")
         

          MODIFIED=false

          while read FILE; do
            FILE_CONTENT=$(cat "$FILE")
            PROMPT="Ecco il file $FILE:\n$FILE_CONTENT\n\nRisolvi questa issue (${ISSUE_TITLE}):\n$ISSUE_BODY\n\nRispondi solo con il file aggiornato (o identico se non serve cambiare), senza commenti o spiegazioni."

            AI_CODE=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2024-04-10" \
              /models/text/copilot-4 \
              -f prompt="$PROMPT" | jq -r '.choices[0].text')

            # Confronta e sovrascrivi solo se cambiato
            if [ "$AI_CODE" != "$FILE_CONTENT" ]; then
              echo "$AI_CODE" > "$FILE"
              MODIFIED=true
              echo "Modificato $FILE"
            fi
          done < files_ai_fix.txt

          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
      - name: Create branch & commit fix
        if: steps.ai_fixes.outputs.modified == 'true'
        run: |
          ISSUE_NUMBER=$(jq -r '.issue.number' < "${GITHUB_EVENT_PATH}")
          BRANCH_NAME="ai-fix-issue-${ISSUE_NUMBER}"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          git add .
          git commit -m "AI fix per issue #${ISSUE_NUMBER} (applicato a tutti i file)"
          git push origin "${BRANCH_NAME}"

      - name: Create draft Pull Request
        if: steps.ai_fixes.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          branch: ai-fix-issue-${{ github.event.issue.number }}
          base: dev
          title: "Fix: ${{ github.event.issue.title }}"
          body: |
            Questa PR applica il fix della issue #${{ github.event.issue.number }} a tutti i file del repository.
            Issue: ${{ github.event.issue.body }}
            Tag associato: ai-fix.
          draft: true

      - name: End if nothing modified
        if: steps.ai_fixes.outputs.modified != 'true'
        run: echo "Nessuna modifica necessaria secondo il modello AI, workflow terminato."